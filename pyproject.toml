[project]
name = "bcgx-livraisonco"
version = "1.0.0"
description = "Prévision horaire du trafic parisien pour LivraisonCo — Les Architectes"
readme = "README.md"
authors = [
    { name = "Amin Belfkira", email = "amin@belfkira.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "tabulate>=0.10.0",
    "xgboost>=3.4.1",
]

[project.optional-dependencies]
presentation = [
    "python-pptx==1.0.2",
    "reportlab==5.1.0",
    "pymupdf==2.1",
]

[tool.uv]
package = false
